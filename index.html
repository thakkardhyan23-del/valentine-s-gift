<style>
:root{--tulip:#E0457F;--petal:#FFFBFC;--ink:#3A2230;--leaf:#E4EDDD;--leafink:#2F4229;--soft:#7A3F57;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#F3B3CB}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px 16px;font-family:var(--sans);color:var(--ink);
background:radial-gradient(120% 80% at 50% 0%,#FBDDE8 0%,#F6C3D4 55%,#F1A9C3 100%)}
#fx,#fl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
#fl{z-index:0}
.card{width:min(100%,440px);position:relative;z-index:1;background:rgba(255,251,252,.8);border-radius:6px;padding:22px 22px 26px;text-align:center;
box-shadow:0 18px 50px rgba(150,40,90,.22)}
.photos{display:grid;grid-template-columns:1.32fr 1fr;grid-template-rows:1fr 1fr;gap:9px;aspect-ratio:990/627}
.photos img{width:100%;height:100%;object-fit:cover;display:block;border-radius:3px;min-height:0}
.photos img:first-child{grid-row:span 2}
h1{font:700 clamp(2.1rem,9.5vw,2.9rem)/1.05 var(--serif);letter-spacing:-.025em;margin:28px 0 8px}
.sub{margin:0;color:var(--soft);font-size:1.05rem}
.ask{margin-top:34px}
.ask p{font:italic 400 1.45rem var(--serif);margin:0 0 16px}
.row{display:flex;gap:12px;justify-content:center}
.slot{display:inline-block}
button{font:700 1rem var(--sans);min-height:50px;min-width:132px;border:0;border-radius:4px;cursor:pointer;white-space:nowrap}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#yes{background:var(--tulip);color:#fff;box-shadow:4px 5px 0 rgba(224,69,127,.28);transition:transform .25s}
#no{background:var(--leaf);color:var(--leafink)}
#no.fly{position:fixed;z-index:20;margin:0;transition:left .28s cubic-bezier(.3,1.4,.5,1),top .28s cubic-bezier(.3,1.4,.5,1)}
.thanks{margin-top:34px;font:italic 400 1.4rem/1.35 var(--serif)}
.cookie{display:block;margin:30px auto 0;background:none;min-width:0;min-height:0;padding:6px 10px;color:var(--soft);
font:italic 400 1rem/1.3 var(--serif);white-space:normal;max-width:300px}
.cookie svg{display:block;margin:0 auto 6px;animation:wob 3.2s ease-in-out infinite;transform-origin:50% 80%}
@keyframes wob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-9deg)}92%{transform:rotate(8deg)}}
.sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(58,34,48,.5);
opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.sheet.open{opacity:1;visibility:visible}
.panel{width:min(100%,380px);background:var(--petal);border-radius:6px;padding:26px 24px 22px;text-align:center;
transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.sheet.open .panel{transform:none}
.panel h2{font:700 1.5rem/1.15 var(--serif);margin:0 0 18px}
.panel dl{margin:0}
.panel dt{font:italic 400 .95rem var(--serif);color:var(--soft)}
.panel dd{margin:2px 0 16px;font:700 1.2rem var(--sans)}
.panel .foot{font-size:.95rem;color:var(--soft);margin:4px 0 18px}
.panel button{background:var(--tulip);color:#fff}
@media (prefers-reduced-motion:reduce){.cookie svg{animation:none}#no.fly{transition:none}.panel{transition:none}}
</style>
</head>

<script>
(()=>{
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- confetti: pink tulip + white tulip ---------- */
const cv=$('fx'),cx=cv.getContext('2d');
let W,H;
const fv=$('fl'),fx=fv.getContext('2d');
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;for(const [c,g] of [[cv,cx],[fv,fx]]){c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}}
size();addEventListener('resize',size);
const PINK=['#F48FB1','#F06292','#E0457F','#F8BBD0','#FF8FB8'],WHITE=['#FFFFFF','#FFF8FB','#FFFDFA'],LEAF=['#9DBF98'],CRUMB=['#D9A45F','#B9822F','#5A3320'];
const pick=a=>a[Math.random()*a.length|0];
const tulip=()=>{const r=Math.random();return r<.4?pick(WHITE):r<.94?pick(PINK):pick(LEAF)};
let ps=[],on=false;
function add(x,y,vx,vy,crumb){
  ps.push({x,y,vx,vy,w:7+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,
  wob:Math.random()*6.3,c:crumb?pick(CRUMB):tulip(),s:crumb?2:Math.random()<.45?1:0,life:0,max:260+Math.random()*140});
}
function burst(x,y,n,power,base,spread,crumb){
  if(reduce)return;
  for(let i=0;i<n;i++){const a=base+(Math.random()-.5)*spread,s=power*(.35+Math.random()*.65);add(x,y,Math.cos(a)*s,Math.sin(a)*s,crumb)}
  go();
}
function rain(n){
  if(reduce)return;
  for(let i=0;i<n;i++)add(Math.random()*W,-20-Math.random()*H*.4,(Math.random()-.5)*2,1+Math.random()*2);
  go();
}
function tick(){
  cx.clearRect(0,0,W,H);
  ps=ps.filter(p=>p.life<p.max&&p.y<H+30);
  for(const p of ps){
    p.life++;p.vy+=.12;p.vx*=.985;p.vy*=.985;p.wob+=.12;p.r+=p.vr;
    p.x+=p.vx+Math.sin(p.wob)*.5;p.y+=p.vy;
    cx.save();cx.globalAlpha=Math.min(1,(p.max-p.life)/40);cx.translate(p.x,p.y);cx.rotate(p.r);
    cx.fillStyle=p.c;cx.strokeStyle='rgba(224,69,127,.45)';cx.lineWidth=1;
    if(p.s==2){cx.beginPath();cx.arc(0,0,p.h/2,0,6.3);cx.fill()}
    else{
      cx.scale(1,Math.cos(p.wob));
      if(p.s==1){cx.beginPath();cx.moveTo(-p.w/2,0);cx.quadraticCurveTo(0,-p.h*1.2,p.w/2,0);cx.quadraticCurveTo(0,p.h*1.2,-p.w/2,0);cx.fill();cx.stroke()}
      else{cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.strokeRect(-p.w/2,-p.h/2,p.w,p.h)}
    }
    cx.restore();
  }
  if(ps.length)requestAnimationFrame(tick);else on=false;
}
function go(){if(!on){on=true;requestAnimationFrame(tick)}}

/* welcome: cannons from both corners + a gentle shower */
const up=-Math.PI/2;
setTimeout(()=>{burst(0,H,70,18,up+.5,.8);burst(W,H,70,18,up-.5,.8);rain(80)},300);
let showers=0;const iv=setInterval(()=>{rain(6);if(++showers>6){clearInterval(iv);startFlowers()}},700);


/* ---------- then: tulips drift down behind the card, for good ---------- */
const PAIRS=[['#E85D93','#F7A1C0'],['#F06292','#FBBBD2'],['#D63B77','#F48FB1'],['#F3E8EE','#FFFFFF'],['#EFE3EA','#FFFDFA'],['#F3E8EE','#FFFFFF']];
let fl=[],fOn=false,fLast=0;
function spawn(y){
  const s=11+Math.random()*12,z=s/23;
  fl.push({x:Math.random()*W,y:y!=null?y:-s*2.5,s,vy:.5+z*.9,t:Math.random()*6.3,sw:.4+Math.random()*.6,
  r:(Math.random()-.5)*1.2,vr:(Math.random()-.5)*.012,a:.5+z*.4,c:pick(PAIRS)});
}
function drawTulip(p){
  const s=p.s;
  fx.save();fx.globalAlpha=p.a;fx.translate(p.x,p.y);fx.rotate(p.r);fx.lineCap='round';
  fx.strokeStyle='#8FB58A';fx.lineWidth=Math.max(1,s*.1);
  fx.beginPath();fx.moveTo(0,s*.45);fx.quadraticCurveTo(s*.2,s*.9,0,s*1.5);fx.stroke();
  fx.fillStyle='#A8C9A2';
  fx.beginPath();fx.moveTo(0,s*1.2);fx.quadraticCurveTo(s*.55,s*1.05,s*.45,s*.65);fx.quadraticCurveTo(s*.1,s*.9,0,s*1.2);fx.fill();
  fx.strokeStyle='rgba(176,48,100,.35)';fx.lineWidth=1;fx.fillStyle=p.c[0];
  fx.beginPath();fx.moveTo(0,s*.5);fx.bezierCurveTo(-s*.6,s*.45,-s*.55,-s*.15,-s*.42,-s*.6);fx.bezierCurveTo(-s*.2,-s*.35,-s*.05,-s*.1,0,s*.5);fx.fill();fx.stroke();
  fx.beginPath();fx.moveTo(0,s*.5);fx.bezierCurveTo(s*.6,s*.45,s*.55,-s*.15,s*.42,-s*.6);fx.bezierCurveTo(s*.2,-s*.35,s*.05,-s*.1,0,s*.5);fx.fill();fx.stroke();
  fx.fillStyle=p.c[1];
  fx.beginPath();fx.moveTo(0,s*.52);fx.bezierCurveTo(-s*.34,s*.32,-s*.3,-s*.42,0,-s*.75);fx.bezierCurveTo(s*.3,-s*.42,s*.34,s*.32,0,s*.52);fx.fill();fx.stroke();
  fx.restore();
}
function flow(t){
  fx.clearRect(0,0,W,H);
  if(fl.length<34&&t-fLast>500){spawn();fLast=t}
  fl=fl.filter(p=>p.y<H+p.s*2);
  for(const p of fl){p.t+=.02*p.sw;p.y+=p.vy;p.x+=Math.sin(p.t)*.45;p.r+=p.vr+Math.cos(p.t)*.004;drawTulip(p)}
  requestAnimationFrame(flow);
}
function startFlowers(){
  if(reduce||fOn)return;fOn=true;
  for(let i=0;i<12;i++)spawn(-Math.random()*H*.7);
  requestAnimationFrame(flow);
}

/* ---------- the button that refuses to be pressed ---------- */
const yes=$('yes'),no=$('no'),slot=$('slot'),cookie=$('cookie'),sheet=$('sheet');
const quips=['Nope.','Too slow','Nice try','Not today','Missed me','Say yes','Still no'];
let n=0,floating=false,lastT=0,done=false;
const rc=e=>e.getBoundingClientRect();
const hit=(a,b,p)=>a.left<b.right+p&&a.right>b.left-p&&a.top<b.bottom+p&&a.bottom>b.top-p;

function dodge(ev){
  if(ev&&ev.cancelable)ev.preventDefault();
  if(done||sheet.classList.contains('open'))return;
  const t=performance.now();if(t-lastT<180)return;lastT=t;
  const r0=rc(no);
  if(!floating){
    slot.style.width=r0.width+'px';slot.style.height=r0.height+'px';
    no.style.width=r0.width+'px';no.style.left=r0.left+'px';no.style.top=r0.top+'px';
    no.classList.add('fly');floating=true;void no.offsetWidth;
  }
  const w=no.offsetWidth,h=no.offsetHeight,m=10,ys=rc(yes),cs=rc(cookie),far=Math.min(innerWidth,innerHeight)*.3;
  let x,y,k=0,box;
  do{
    x=m+Math.random()*(innerWidth-w-2*m);y=m+Math.random()*(innerHeight-h-2*m);k++;
    box={left:x,top:y,right:x+w,bottom:y+h};
  }while(k<60&&(hit(box,ys,20)||hit(box,cs,6)||Math.hypot(x-r0.left,y-r0.top)<far));
  no.style.left=x+'px';no.style.top=y+'px';
  no.textContent=quips[n++%quips.length];
  yes.style.transform='scale('+Math.min(1.3,1+n*.04)+')';
}
['pointerenter','pointerdown','focus','click'].forEach(e=>no.addEventListener(e,dodge));
no.addEventListener('touchstart',dodge,{passive:false});
no.addEventListener('keydown',dodge);
addEventListener('pointermove',e=>{
  if(!floating&&e.pointerType!=='mouse')return;
  const r=rc(no),d=Math.hypot(Math.max(r.left-e.clientX,0,e.clientX-r.right),Math.max(r.top-e.clientY,0,e.clientY-r.bottom));
  if(d<60)dodge();
});
addEventListener('pointerdown',e=>{
  const r=rc(no),d=Math.hypot(Math.max(r.left-e.clientX,0,e.clientX-r.right),Math.max(r.top-e.clientY,0,e.clientY-r.bottom));
  if(d<44)dodge(e);
});
addEventListener('resize',()=>{if(floating){
  no.style.left=Math.max(10,Math.min(parseFloat(no.style.left),innerWidth-no.offsetWidth-10))+'px';
  no.style.top=Math.max(10,Math.min(parseFloat(no.style.top),innerHeight-no.offsetHeight-10))+'px';}});

/* ---------- the only answer ---------- */
yes.addEventListener('click',()=>{
  done=true;
  const r=rc(yes);
  burst(r.left+r.width/2,r.top,240,17,up,Math.PI);
  rain(90);
  $('ask').hidden=true;$('thanks').hidden=false;
});

/* ---------- cookie reveal ---------- */
function openSheet(){
  const r=rc(cookie);
  burst(r.left+r.width/2,r.top+30,36,9,up,Math.PI,true);
  sheet.classList.add('open');$('close').focus();
}
function closeSheet(){sheet.classList.remove('open');cookie.focus()}
cookie.addEventListener('click',openSheet);
$('close').addEventListener('click',closeSheet);
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('open'))closeSheet()});
})();
</script>
